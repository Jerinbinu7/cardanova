ested by hand — individually plucked at the precise moment of peak maturity, when volatile oil concentration and pod colour are at their optimal. Our network of 250+ trusted smallholder farming families follows strict harvesting protocols: only pods that pass a visual ripeness check are collected per plant, preventing any premature or over-mature pods from entering the supply chain.",detail:"Harvesting by hand ensures zero mechanical damage to the pod skin — critical for preserving the essential oils locked within.",image:"https://images.unsplash.com/photo-1529693662653-9d480530a697?q=80&w=1400&auto=format&fit=crop",accent:"#C5A046",icon:c.jsx("svg",{className:"w-6 h-6",fill:"none",viewBox:"0 0 24 24",stroke:"currentColor",children:c.jsx("path",{strokeLinecap:"round",strokeLinejoin:"round",strokeWidth:1.5,d:"M7 11.5V14m0-2.5v-6a1.5 1.5 0 113 0m-3 6a1.5 1.5 0 00-3 0v2a7.5 7.5 0 0015 0v-5a1.5 1.5 0 00-3 0m-6-3V11m0-5.5v-1a1.5 1.5 0 013 0v1m0 0V11m0-5.5a1.5 1.5 0 013 0v3m0 0V11"})})},{step:"03",phase:"Curing & Drying",title:"Flue-Cured for Colour Retention",subtitle:"Controlled Temperature · 40–55°C",body:"Immediately after harvest, pods undergo our proprietary flue-curing process — a temperature-controlled curing method that maintains the vibrant natural green colour characteristic of top-grade cardamom. Unlike sun-drying (which bleaches pods and degrades oils), flue-curing at 40–55°C preserves the natural chlorophyll pigment and locks in volatile oil concentrations above international export benchmarks.",detail:"Pods are spread on raised bamboo curing beds inside curing chambers — ensuring uniform airflow and consistent moisture reduction to under 9.5%.",image:"https://images.unsplash.com/photo-1596040033229-a9821ebd058d?q=80&w=1400&auto=format&fit=crop",accent:"#A18637",icon:c.jsxs("svg",{className:"w-6 h-6",fill:"none",viewBox:"0 0 24 24",stroke:"currentColor",children:[c.jsx("path",{strokeLinecap:"round",strokeLinejoin:"round",strokeWidth:1.5,d:"M17.657 18.657A8 8
